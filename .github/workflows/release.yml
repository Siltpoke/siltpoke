name: release

# Tag-driven GitHub Release builder.
#
# Triggered by tags matching v*.*.* (plain SemVer). Extracts the matching
# section from CHANGELOG.md and publishes it as the GitHub Release body,
# with PR-label-grouped auto-notes appended (via .github/release.yml).
#
# **DORMANT (workflow_dispatch only)** until GitHub Actions billing resumed.
# To restore tag-trigger: replace `workflow_dispatch:` block with:
#   on:
#     push:
#       tags:
#         - "v*.*.*"
#     workflow_dispatch:
#       inputs:
#         tag:
#           description: "Tag to build release from (e.g. v0.1.0)"
#           required: true
#           type: string

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build release from (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Derive version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: extract
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Pull the section between `## [VERSION]` and the next `## [` heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/      { exit }
            capture                  { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::No section [$VERSION] found in CHANGELOG.md"
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Full changelog: [\`CHANGELOG.md\`](./CHANGELOG.md)"
          } >> release-body.md
          echo "body_file=release-body.md" >> "$GITHUB_OUTPUT"

      - name: Validate manifest versions match tag
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Every manifest that ships in the public snapshot and carries a
          # version a user can read. Checking only the two `.claude-plugin`
          # files let `.codex-plugin/plugin.json` ship a release behind, since
          # `codex plugin marketplace add` reads that file and no gate looked
          # at it. `jq -e` also fails when the path is absent, which is how the
          # marketplace read silently produced `null` for every tag.
          fail=0
          check_version() {
            path="$1"; expr="$2"
            actual=$(jq -er "$expr" "$path") || {
              echo "::error::$path: no version at $expr"
              fail=1
              return
            }
            if [ "$actual" != "$VERSION" ]; then
              echo "::error::$path version ($actual) != tag ($VERSION)"
              fail=1
            fi
          }
          check_version .claude-plugin/plugin.json '.version'
          check_version .claude-plugin/marketplace.json '.plugins[0].version'
          check_version .antigravity-plugin/plugin.json '.version'
          check_version .codex-plugin/plugin.json '.version'
          check_version package.json '.version'
          [ "$fail" -eq 0 ] || exit 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          IS_PRE=""
          if [[ "$TAG" == *-* ]]; then IS_PRE="--prerelease"; fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-body.md \
            --generate-notes \
            $IS_PRE
