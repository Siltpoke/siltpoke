name: test

# ──────────────────────────────────────────────────────────────────────────────
# Dormant (workflow_dispatch only). The workflow stays in-repo as the
# canonical CI spec; auto-trigger on push / PR is disabled.
#
# **To restore auto-CI once billing is resolved:**
#   1. Edit the `on:` block below — replace `workflow_dispatch` with:
#        on:
#          push:
#            branches: [main]
#          pull_request:
#   2. Commit + push. Auto-runs resume immediately on the next push/PR.
#
# Local verification before merging:
#   bunx tsc --noEmit                                  # 0 errors
#   bun test                                           # 0 fail
#   for i in 1 2 3; do bun run e2e || exit 1; done     # 3/3 green
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      - name: TypeScript type check
        run: bunx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets (required for Alpine.js bundle)
        run: bun run build:web

      - name: Install Playwright Chromium
        run: bun run e2e:install

      # Merge gate: run the suite 3 consecutive times.
      # All 3 must pass — a single failure is a real flake or bug.
      - name: E2E run 1/3
        run: bun run e2e

      - name: E2E run 2/3
        run: bun run e2e

      - name: E2E run 3/3
        run: bun run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
