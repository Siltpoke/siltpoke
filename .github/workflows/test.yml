name: e2e

# ──────────────────────────────────────────────────────────────────────────────
# Playwright end-to-end suite.
#
# LIVE since 2026-07-12. Previously dormant (workflow_dispatch only) during the
# GitHub Actions billing pause.
#
# THIS IS THE ONE THAT MATTERED. The e2e suite is NOT part of `bun test`, so with
# this workflow dormant nothing ran it at all — a pure blind spot. Two specs in
# tests/e2ea retired page.spec.ts were red on `main` for weeks and nobody knew (they
# pinned mutable production data: a hardcoded "an active entry" title that the board
# legitimately drops to zero between tracks). Since fixed; this gate is what
# stops it recurring.
#
# COST NOTE — this repo is PRIVATE, so Actions minutes are BILLED. Shaped to be
# cheap on purpose:
#   - unit tests + tsc are NOT repeated here; ci.yml owns them (no double-billing).
#   - `concurrency` cancels superseded runs on force-push.
#   - Playwright's Chromium download is cached across runs.
#   - PRs run the suite ONCE (fast feedback). Only a push to `main` runs it 3×,
#     which is the flake gate — a spec that passes 1/3 is a real flake or bug.
#     (Full suite ≈ 1.7 min locally.)
#
# To make dormant again: replace the `on:` block with `on: workflow_dispatch:`
# ──────────────────────────────────────────────────────────────────────────────

# ── Inert-doc skip (cost control, 2026-08-03) ────────────────────────────────
# Mirrors ci.yml's block — see there for the audit and, more importantly, for
# the four LOAD-BEARING documents that are deliberately absent from this list.
# It is a denylist on purpose: anything not listed still runs. Do NOT collapse
# it to `docs/**` or `**.md`.
# ──────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match ci.yml (which byte-compares the committed dist/ bundles
          # via check:dist) so the whole CI runs one deterministic bun. Bump with ci.yml.
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets (required for the Alpine.js bundle)
        run: bun run build:web

      # Cache the browser binary — it is the slowest step and it never changes
      # between runs unless the Playwright version does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run e2e:install

      # Ensure system deps exist even on a cache hit (cheap; no browser download).
      - name: Install Playwright system deps
        run: bunx playwright install-deps chromium

      # PRs: one run — fast, cheap feedback.
      - name: E2E (pull request)
        if: github.event_name == 'pull_request'
        run: bun run e2e

      # main: three consecutive runs — the merge/flake gate. All 3 must pass;
      # a single failure is a real flake or a real bug.
      - name: E2E 3× (main — flake gate)
        if: github.event_name != 'pull_request'
        run: |
          set -e
          for i in 1 2 3; do
            echo "── e2e run $i/3 ──"
            bun run e2e
          done

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
